<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>獨旅 in TOKYO 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --washi:#f7f3ed;--ink:#1a1a18;--ink-s:#5a5a54;--ink-t:#9a9990;
  --sakura:#b85c6e;--sakura-bg:#f9eeef;
  --matcha:#4a6741;--matcha-bg:#edf2eb;
  --sora:#2f6fa8;--sora-bg:#eaf1f8;
  --amber:#8a6820;--amber-bg:#f5eed8;
  --border:rgba(26,26,24,0.12);--bg:#ffffff;--bg-s:#f7f3ed;
}
html,body{font-family:'Noto Sans JP',sans-serif;background:var(--washi);color:var(--ink);min-height:100vh}
.ms{font-family:'Material Symbols Outlined';font-style:normal;display:inline-flex;align-items:center;font-size:16px;line-height:1;vertical-align:-3px;font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 20}

/* ---- APP SHELL ---- */
.app{max-width:480px;margin:0 auto;background:var(--bg);height:100vh;display:flex;flex-direction:column;opacity:0;transition:opacity 0.9s ease;position:fixed;top:0;left:0;right:0}
.app.visible{opacity:1}

/* ---- SPLASH ---- */
#splash{position:fixed;inset:0;background:var(--washi);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;opacity:1;transition:opacity 0.9s ease}
#splash.fade-out{opacity:0;pointer-events:none}
.splash-eyebrow{font-family:'Noto Sans JP',sans-serif;font-size:13px;font-weight:400;letter-spacing:0.28em;color:var(--ink-t);opacity:0;transform:translateY(8px);animation:splashIn 0.8s ease 0.2s forwards;margin-bottom:10px}
.splash-logo{font-family:'Noto Serif JP',serif;font-size:54px;font-weight:300;letter-spacing:0.14em;color:var(--ink);opacity:0;transform:translateY(14px);animation:splashIn 0.9s ease 0.5s forwards;line-height:1}
.splash-sub{font-family:'Noto Serif JP',serif;font-size:14px;font-weight:300;letter-spacing:0.18em;color:var(--sakura);margin-top:12px;opacity:0;animation:splashIn 0.9s ease 0.9s forwards}
.splash-bar{width:32px;height:1px;background:var(--sakura);margin-top:22px;opacity:0;transform:scaleX(0);animation:barIn 0.8s ease 1.2s forwards;transform-origin:left}
@keyframes splashIn{to{opacity:1;transform:translateY(0)}}
@keyframes barIn{to{opacity:1;transform:scaleX(1)}}

/* ---- TOP BAR ---- */
.top-bar{padding:18px 18px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:0.5px solid var(--border);flex-shrink:0}
.logo{font-family:'Noto Serif JP',serif;font-size:18px;font-weight:300;letter-spacing:0.08em;color:var(--ink)}
.logo span{color:var(--sakura)}
.trip-meta{font-size:11px;color:var(--ink-t);text-align:right}

/* ---- BOTTOM NAV ---- */
.bottom-nav{display:flex;border-top:0.5px solid var(--border);background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px 8px;cursor:pointer;color:var(--ink-t);font-size:10px;letter-spacing:0.04em;gap:3px;background:none;border:none;font-family:'Noto Sans JP',sans-serif;transition:color 0.15s}
.bnav-btn .ms{font-size:22px}
.bnav-btn.active{color:var(--sakura)}

/* ---- PAGES ---- */
.tab-page{display:none;flex:1;min-height:0;flex-direction:column}
.tab-page.show{display:flex}

/* ---- ITINERARY ---- */
.legend{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;background:var(--bg-s);font-size:10px;color:var(--ink-s);flex-shrink:0}
.legend-item{display:flex;align-items:center;gap:4px}
.legend-dot{width:8px;height:16px;border-radius:2px;flex-shrink:0}
.day-tabs{display:flex;padding:10px 12px;border-bottom:0.5px solid var(--border);gap:6px;flex-shrink:0}
.dtab{flex:1;padding:7px 4px;border-radius:20px;border:0.5px solid var(--border);font-size:12px;cursor:pointer;color:var(--ink-s);background:var(--bg);font-family:'Noto Sans JP',sans-serif;transition:all 0.15s;line-height:1.4;text-align:center}
.dtab.active{background:var(--ink);color:var(--bg);border-color:transparent}
.day-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.day-panel{display:none;padding:16px}
.day-panel.show{display:block}
.day-header{display:flex;align-items:baseline;gap:10px;padding:4px 0 16px;border-bottom:0.5px solid var(--border);margin-bottom:16px}
.day-header .dnum{font-family:'Noto Serif JP',serif;font-size:30px;font-weight:300;color:var(--sakura);line-height:1}
.day-header .dinfo h2{font-family:'Noto Serif JP',serif;font-size:15px;font-weight:400;letter-spacing:0.04em}
.day-header .dinfo p{font-size:11px;color:var(--ink-t);margin-top:3px}
.step{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start}
.step-left{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:32px}
.step-num{width:26px;height:26px;border-radius:50%;border:0.5px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:var(--ink-s);flex-shrink:0}
.step-line{width:1px;background:var(--border);flex:1;min-height:16px;margin-top:3px}
.step-card{flex:1;background:var(--bg);border:0.5px solid var(--border);border-radius:12px;padding:11px 13px;min-width:0;cursor:pointer;position:relative}
.step-card.transport{border-left:2.5px solid #b8cde0;border-radius:0 12px 12px 0}
.step-card.food{border-left:2.5px solid #e4b0ba;border-radius:0 12px 12px 0}
.step-card.stay{border-left:2.5px solid #a8c5a0;border-radius:0 12px 12px 0}
.step-card.shop{border-left:2.5px solid #d4c08a;border-radius:0 12px 12px 0}
.sc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:4px}
.sc-title{font-size:13px;font-weight:500;line-height:1.4;color:var(--ink)}
.sc-time{font-size:11px;color:var(--ink-t);white-space:nowrap;padding-top:1px;flex-shrink:0}
.sc-sub{font-size:11px;color:var(--ink-s);line-height:1.7;white-space:pre-line}
.tag-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.tag{font-size:10px;padding:2px 8px;border-radius:20px;white-space:nowrap}
.tag-transport{background:var(--sora-bg);color:var(--sora)}
.link-btn{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--sora);text-decoration:none;padding:4px 9px;border:0.5px solid #b5d4f4;border-radius:6px;margin-top:7px;cursor:pointer;background:var(--sora-bg)}
.link-btn:hover{background:#d5e8f6}
.divider{height:0.5px;background:var(--border);margin:10px 0}
.flight-card{background:var(--bg-s);border-radius:10px;padding:10px 12px;margin-top:7px}
.flight-row{display:flex;align-items:center;gap:8px}
.flight-time{font-size:17px;font-weight:500;font-family:'Noto Serif JP',serif;color:var(--ink)}
.flight-arrow{flex:1;display:flex;align-items:center;gap:4px;color:var(--sora)}
.flight-arrow::before,.flight-arrow::after{content:'';height:0.5px;background:var(--border);flex:1}
.flight-info{font-size:11px;color:var(--ink-s);margin-top:5px}
.add-step-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:10px;border:1px dashed var(--border);border-radius:10px;background:transparent;color:var(--ink-t);font-size:13px;font-family:'Noto Sans JP',sans-serif;cursor:pointer;margin-top:4px;margin-bottom:16px}
.add-step-btn:hover{background:var(--bg-s);color:var(--ink-s)}
.edit-icon{flex-shrink:0;margin-top:1px;color:var(--ink-t)}

/* ---- EDIT MODAL ---- */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:500;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.25s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-sheet{background:var(--bg);border-radius:20px 20px 0 0;padding:20px 18px 36px;width:100%;max-width:480px;transform:translateY(40px);transition:transform 0.3s ease;max-height:85vh;overflow-y:auto}
.modal-overlay.open .modal-sheet{transform:translateY(0)}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 18px}
.modal-title{font-family:'Noto Serif JP',serif;font-size:15px;font-weight:400;margin-bottom:16px}
.field-group{margin-bottom:12px}
.field-label{font-size:11px;color:var(--ink-t);margin-bottom:5px}
.field-input,.field-select,.field-textarea{width:100%;border:0.5px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;font-family:'Noto Sans JP',sans-serif;color:var(--ink);background:var(--bg);outline:none}
.field-textarea{min-height:72px;resize:vertical;line-height:1.6}
.field-input:focus,.field-select:focus,.field-textarea:focus{border-color:var(--sakura)}
.modal-actions{display:flex;gap:8px;margin-top:18px}
.btn-save{flex:1;background:var(--ink);color:var(--bg);border:none;border-radius:10px;padding:12px;font-size:14px;font-family:'Noto Sans JP',sans-serif;cursor:pointer}
.btn-cancel{background:var(--bg-s);color:var(--ink-s);border:0.5px solid var(--border);border-radius:10px;padding:12px 16px;font-size:14px;font-family:'Noto Sans JP',sans-serif;cursor:pointer}
.btn-delete{background:var(--sakura-bg);color:var(--sakura);border:0.5px solid #e4b0ba;border-radius:10px;padding:12px 14px;font-size:14px;cursor:pointer;display:flex;align-items:center}

/* ---- PAGE HEADER ---- */
.page-header{padding:18px 18px 14px;border-bottom:0.5px solid var(--border);flex-shrink:0}
.page-header h2{font-family:'Noto Serif JP',serif;font-size:16px;font-weight:400;letter-spacing:0.04em}
.page-header p{font-size:11px;color:var(--ink-t);margin-top:3px}
.page-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;min-height:0}

/* ---- EXCHANGE ---- */
.rate-card{background:var(--bg-s);border-radius:12px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.rate-label{font-size:11px;color:var(--ink-t)}
.rate-value{font-family:'Noto Serif JP',serif;font-size:18px;font-weight:400;color:var(--ink);margin-top:3px}
.rate-note{font-size:10px;color:var(--ink-t);margin-top:4px;text-align:right}
.add-btn{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--sora);background:var(--sora-bg);border:0.5px solid #b5d4f4;border-radius:8px;padding:5px 10px;cursor:pointer;font-family:'Noto Sans JP',sans-serif}
.exch-input-wrap{background:var(--bg);border:0.5px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.exch-label{font-size:11px;color:var(--ink-t);margin-bottom:6px}
.exch-row{display:flex;align-items:center;gap:8px}
.exch-currency{font-size:13px;font-weight:500;color:var(--ink-s);min-width:28px}
.exch-field{flex:1;border:none;outline:none;font-size:22px;font-family:'Noto Serif JP',serif;font-weight:300;color:var(--ink);background:transparent;min-width:0}
.exch-clear{background:none;border:none;cursor:pointer;color:var(--ink-t);padding:4px;display:flex}
.exch-result{background:var(--sakura-bg);border-radius:12px;padding:14px 16px;margin-bottom:20px}
.r-label{font-size:11px;color:var(--sakura);margin-bottom:4px}
.r-value{font-family:'Noto Serif JP',serif;font-size:28px;font-weight:300;color:var(--sakura)}
.r-note{font-size:11px;color:var(--sakura);opacity:0.7;margin-top:2px}
.ledger-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ledger-head h3{font-family:'Noto Serif JP',serif;font-size:14px;font-weight:400}
.ledger-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--border)}
.ledger-item:last-child{border-bottom:none}
.li-info{flex:1;min-width:0}
.li-name{font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-jpy{font-size:11px;color:var(--ink-t);margin-top:1px}
.li-twd{font-size:13px;font-weight:500;color:var(--sakura);white-space:nowrap}
.li-del{background:none;border:none;cursor:pointer;color:var(--ink-t);padding:4px;display:flex}
.ledger-total{background:var(--bg-s);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.t-label{font-size:12px;color:var(--ink-s)}
.t-jpy{font-size:11px;color:var(--ink-t)}
.t-twd{font-family:'Noto Serif JP',serif;font-size:20px;font-weight:400;color:var(--sakura)}

/* ---- SHOPPING LIST ---- */
.sl-add-bar{display:flex;gap:8px;margin-bottom:16px}
.sl-add-bar input{flex:1;border:0.5px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;font-family:'Noto Sans JP',sans-serif;outline:none;background:var(--bg);color:var(--ink)}
.sl-add-bar input:focus{border-color:var(--sakura)}
.sl-add-btn{background:var(--ink);color:var(--bg);border:none;border-radius:8px;width:38px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sl-item{background:var(--bg);border:0.5px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;transition:opacity 0.2s}
.sl-item.checked{opacity:0.45}
.sl-top{display:flex;align-items:flex-start;gap:10px}
.sl-check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all 0.15s;background:var(--bg)}
.sl-check.on{background:var(--matcha);border-color:var(--matcha);color:white;font-size:11px}
.sl-name{flex:1;font-size:13px;color:var(--ink);line-height:1.5;word-break:break-all}
.sl-item.checked .sl-name{text-decoration:line-through;color:var(--ink-t)}
.sl-del-btn{background:none;border:none;cursor:pointer;color:var(--ink-t);padding:2px;display:flex;margin-left:auto}
.sl-actions{display:flex;align-items:center;gap:6px;margin-top:8px;margin-left:30px}
.sl-price-wrap{display:flex;align-items:center;gap:4px;flex:1;min-width:0}
.sl-price-label{font-size:11px;color:var(--ink-t);flex-shrink:0}
.sl-price-input{border:0.5px solid var(--border);border-radius:6px;padding:4px 8px;font-size:12px;width:80px;font-family:'Noto Sans JP',sans-serif;color:var(--ink);background:var(--bg);outline:none}
.sl-price-twd{font-size:12px;color:var(--sakura);font-weight:500;white-space:nowrap}
.sl-img-btn{font-size:11px;color:var(--sora);background:var(--sora-bg);border:0.5px solid #b5d4f4;border-radius:6px;padding:4px 8px;cursor:pointer;display:flex;align-items:center;gap:3px;white-space:nowrap;flex-shrink:0}
.compare-row{display:flex;align-items:center;gap:6px;margin-top:6px;margin-left:30px}
.compare-input{border:0.5px solid var(--border);border-radius:6px;padding:4px 8px;font-size:12px;width:80px;font-family:'Noto Sans JP',sans-serif;color:var(--ink);background:var(--bg);outline:none}
.compare-badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500}
.compare-better{background:var(--matcha-bg);color:var(--matcha)}
.compare-worse{background:var(--sakura-bg);color:var(--sakura)}
.sl-img-preview{margin-top:8px;margin-left:30px;display:flex;gap:6px;flex-wrap:wrap}
.sl-img-preview img{width:60px;height:60px;object-fit:cover;border-radius:6px;border:0.5px solid var(--border);cursor:pointer}
.sl-section-label{font-size:11px;color:var(--ink-t);letter-spacing:0.08em;margin:14px 0 8px;padding-bottom:6px;border-bottom:0.5px solid var(--border)}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="splash-eyebrow">我要去獨旅</div>
  <div class="splash-logo">TOKYO</div>
  <div class="splash-sub">I'm in tokyo</div>
  <div class="splash-bar"></div>
</div>

<!-- APP -->
<div class="app" id="mainApp">

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="logo">獨旅 in <span>TOKYO</span></div>
    <div class="trip-meta">日本 2026<br>06/18 – 06/23</div>
  </div>

  <!-- ===================== PAGE: 行程 ===================== -->
  <div id="page-itinerary" class="tab-page show">
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#b8cde0"></div>交通</div>
      <div class="legend-item"><div class="legend-dot" style="background:#e4b0ba"></div>餐廳</div>
      <div class="legend-item"><div class="legend-dot" style="background:#a8c5a0"></div>住宿</div>
      <div class="legend-item"><div class="legend-dot" style="background:#d4c08a"></div>景點/購物</div>
    </div>
    <div class="day-tabs">
      <button class="dtab active" onclick="switchDay(0)">Day 1<br><span style="font-size:10px;opacity:.7">06/18</span></button>
      <button class="dtab" onclick="switchDay(1)">Day 2<br><span style="font-size:10px;opacity:.7">06/20</span></button>
      <button class="dtab" onclick="switchDay(2)">Day 3<br><span style="font-size:10px;opacity:.7">06/21</span></button>
      <button class="dtab" onclick="switchDay(3)">Day 4<br><span style="font-size:10px;opacity:.7">06/22</span></button>
      <button class="dtab" onclick="switchDay(4)">Day 5<br><span style="font-size:10px;opacity:.7">06/23</span></button>
    </div>
    <div class="day-scroll">
      <div id="itinerary-container"></div>
    </div>
  </div>

  <!-- ===================== PAGE: 換算 ===================== -->
  <div id="page-exchange" class="tab-page">
    <div class="page-header">
      <h2>匯率換算</h2>
      <p>日幣 ↔ 台幣 即時換算 · 消費記帳</p>
    </div>
    <div class="page-scroll">
      <div class="rate-card">
        <div>
          <div class="rate-label">今日匯率（參考）</div>
          <div class="rate-value">1 JPY = <span id="rateNum">0.2130</span> TWD</div>
        </div>
        <div style="text-align:right">
          <button class="add-btn" onclick="fetchRate()"><span class="ms" style="font-size:14px">refresh</span> 更新</button>
          <div class="rate-note" id="rateTime">點擊更新取得即時匯率</div>
        </div>
      </div>
      <div class="exch-input-wrap">
        <div class="exch-label">輸入日幣金額</div>
        <div class="exch-row">
          <span class="exch-currency">¥</span>
          <input class="exch-field" id="jpyInput" type="number" placeholder="0" inputmode="numeric" oninput="calcExchange()">
          <button class="exch-clear" onclick="clearExch()"><span class="ms">close</span></button>
        </div>
      </div>
      <div class="exch-result">
        <div class="r-label">換算台幣</div>
        <div class="r-value" id="twdResult">NT$ 0</div>
        <div class="r-note" id="calcNote">—</div>
      </div>
      <div class="ledger-head">
        <h3>消費記帳</h3>
        <button class="add-btn" onclick="addLedger()"><span class="ms" style="font-size:14px">add</span> 加入記帳</button>
      </div>
      <div id="ledgerList"></div>
      <div class="ledger-total" id="ledgerTotal" style="display:none">
        <div>
          <div class="t-label">合計支出</div>
          <div class="t-jpy" id="totalJpy"></div>
        </div>
        <div class="t-twd" id="totalTwd"></div>
      </div>
    </div>
  </div>

  <!-- ===================== PAGE: 購買清單 ===================== -->
  <div id="page-shopping" class="tab-page">
    <div class="page-header">
      <h2>購買清單</h2>
      <p>勾選已購 · 比價 · 加圖片</p>
    </div>
    <div class="page-scroll">
      <div class="sl-add-bar">
        <input id="slInput" type="text" placeholder="新增商品名稱…" onkeydown="if(event.key==='Enter')addShopItem()">
        <button class="sl-add-btn" onclick="addShopItem()"><span class="ms" style="font-size:20px">add</span></button>
      </div>
      <div id="slUnchecked"></div>
      <div id="slCheckedWrap" style="display:none">
        <div class="sl-section-label">已購買</div>
        <div id="slChecked"></div>
      </div>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <button class="bnav-btn active" id="bnav-0" onclick="switchTab(0)">
      <span class="ms">map</span>行程
    </button>
    <button class="bnav-btn" id="bnav-1" onclick="switchTab(1)">

</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="editModal" onclick="if(event.target===this)closeModal()">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">編輯行程</div>

</div>

<script>
/* ============================================================
   TAB SWITCHING
   ============================================================ */
var TAB_IDS = ['page-itinerary','page-exchange','page-shopping'];

function switchTab(i){
  TAB_IDS.forEach(function(id,idx){
    var el = document.getElementById(id);
    if(el) el.classList.toggle('show', idx===i);
  });
  document.querySelectorAll('.bnav-btn').forEach(function(b,idx){
    b.classList.toggle('active', idx===i);
  });
}

/* ============================================================
   SPLASH
   ============================================================ */
(function(){
  var splash = document.getElementById('splash');
  var app = document.getElementById('mainApp');
  setTimeout(function(){
    splash.classList.add('fade-out');
    app.classList.add('visible');
    setTimeout(function(){ splash.style.display='none'; }, 950);
  }, 3000);
})();

/* ============================================================
   ITINERARY DATA
   ============================================================ */
var NUMS = ['❶','❷','❸','❹','❺','❻','❼','❽','❾','❿'];
var nextId = 9000;

var days = [
  {
    dayNum:'01', title:'出發 · 東京抵達', sub:'桃園 → 成田 → 新宿 → 大塚',
    steps:[
      {id:101,type:'transport',title:'桃園國際機場',time:'23:00',notes:'06/18 出發\n樂桃航空 MM620 · 02:00 → 06:30 · 約4.5小時',link:'',linkLabel:''},
      {id:102,type:'transport',title:'成田機場 → 新宿',time:'06:30',notes:"N'EX 成田特快 · 約85分鐘\n班次：07:37 · 08:12 · 08:49",link:'https://drive.google.com/file/d/1Q8QgRquTQNYSTKiSi4lDa99P1dc2ZGnH/view',linkLabel:'取票教學'},
      {id:103,type:'transport',title:'新宿 → 大塚',time:'10:00',notes:'山手線 · 約15分鐘',link:'',linkLabel:''},
      {id:104,type:'stay',title:'先放行李 · 住宿',time:'10:30',notes:'',link:'https://maps.app.goo.gl/ez1dCC3emQaY6gPGA?g_st=ic',linkLabel:'地圖'},
      {id:105,type:'food',title:'麵屋武藏 二天',time:'11:00',notes:'池袋 · 午餐',link:'https://maps.app.goo.gl/dSg6YPqbpyRqMTAU6?g_st=ic',linkLabel:'地圖'},
      {id:106,type:'shop',title:'池袋逛街',time:'13:00',notes:'IT TOWER TOKYO · 三麗鷗 GU UQ\n太陽城 10:00–20:00\nAlpa B1F: 吉卜力 · 3coins · MARVEL · Disney\nAlpa 1F: ABC MART · 無印良品 · Loft\nAlpa 2F: Kiddy Land · Snoopy · TOP TOY · 蠟筆小新\nAlpa 3F: 扭蛋\nAnnex B1/1F: 吉伊卡哇',link:'https://maps.app.goo.gl/LTyHDWHe8DoygZXW9?g_st=ic',linkLabel:'地圖'},
      {id:107,type:'stay',title:'回住宿',time:'',notes:'',link:'https://maps.app.goo.gl/ez1dCC3emQaY6gPGA?g_st=ic',linkLabel:'地圖'}
    ]
  },
  {
    dayNum:'02', title:'橫濱 · 新宿', sub:'麵包超人博物館 · 逛街購物',
    steps:[
      {id:201,type:'stay',title:'住宿出發',time:'',notes:'',link:'https://maps.app.goo.gl/ez1dCC3emQaY6gPGA?g_st=ic',linkLabel:'地圖'},
      {id:202,type:'transport',title:'前往橫濱',time:'',notes:"山手線 → 池袋 · 湘南新宿線 → 橫濱\n新高島站 3出口 · ¥715\n麵包超人博物館 10:00–18:00",link:'',linkLabel:''},
      {id:203,type:'food',title:'午餐 · 油そば',time:'',notes:'橫濱',link:'',linkLabel:''},
      {id:204,type:'shop',title:'新宿購物',time:'',notes:'Gacha Gacha no Mori 扭蛋\nKiddy Land Shinjuku\nビックカメラ 新宿東口（GU · UNIQLO · Big Camera）\n無印良品\n丸井 4F seria · 5F 駿河屋\nHands',link:'',linkLabel:''}
    ]
  },
  {
    dayNum:'03', title:'淺草 · 上野 · 秋葉原', sub:'傳統文化與現代文化交匯',
    steps:[
      {id:301,type:'food',title:'淺草',time:'',notes:'炸肉餅 · 花月堂 · 炸饅頭 · 三麗鷗',link:'',linkLabel:''},
      {id:302,type:'food',title:'上野',time:'',notes:'買東西逛街\nとんかつ山家 · 炸豬排',link:'',linkLabel:''},
      {id:303,type:'shop',title:'秋葉原',time:'',notes:'電器街 · 動漫周邊',link:'',linkLabel:''}
    ]
  },
  {
    dayNum:'04', title:'鎌倉一日遊', sub:'海岸線 · 古寺 · 小鎮散策',
    steps:[
      {id:401,type:'transport',title:'新宿 → 藤澤',time:'',notes:'',link:'http://xhslink.com/o/2Fu1mUkOO8D',linkLabel:'購票方式'},
      {id:402,type:'shop',title:'鎌倉景點',time:'',notes:'鎌倉高校前 · 七里之濱 · 長谷寺\n鎌倉大佛 · 小町通 · 鶴岡八幡宮',link:'',linkLabel:''}
    ]
  },
  {
    dayNum:'05', title:'返台', sub:'06/23 · 長榮航空',
    steps:[
      {id:501,type:'transport',title:'長榮航空 BR183',time:'13:25',notes:'成田 → 桃園 · 16:00抵台\n約3.5小時 · 平安抵台！',link:'',linkLabel:''}
    ]
  }
];

var currentDay = 0;

function renderItinerary(){
  var html = '';
  days.forEach(function(day, di){
    html += '<div id="d'+di+'" class="day-panel'+(di===currentDay?' show':'')+'">';
    html += '<div class="day-header">';
    html += '<div class="dnum">'+day.dayNum+'</div>';
    html += '<div class="dinfo">';
    html += '<h2>'+day.title+'</h2>';
    html += '<p>'+day.sub+'</p>';
    html += '</div></div>';
    day.steps.forEach(function(step, si){
      var isLast = si===day.steps.length-1;
      html += '<div class="step">';
      html += '<div class="step-left"><div class="step-num">'+(NUMS[si]||si+1)+'</div>'+(isLast?'':'<div class="step-line"></div>')+'</div>';
      html += '<div class="step-card '+step.type+'" onclick="openEdit('+di+','+si+')">';
      html += '<div style="display:flex;align-items:flex-start;gap:6px">';
      html += '<div style="flex:1;min-width:0">';
      html += '<div class="sc-head"><span class="sc-title">'+esc(step.title)+'</span>'+(step.time?'<span class="sc-time">'+esc(step.time)+'</span>':'')+'</div>';
      if(step.notes) html += '<div class="sc-sub">'+esc(step.notes)+'</div>';
      if(step.link) html += '<a class="link-btn" href="'+step.link+'" target="_blank" onclick="event.stopPropagation()"><span class="ms">location_on</span>'+esc(step.linkLabel)+'</a>';
      html += '</div>';
      html += '<span class="ms edit-icon" style="font-size:14px">edit</span>';
      html += '</div></div></div>';
    });
    html += '<button class="add-step-btn" onclick="openAddStep('+di+')"><span class="ms" style="font-size:18px">add_circle</span>新增行程</button>';
    html += '</div>';
  });
  document.getElementById('itinerary-container').innerHTML = html;
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function switchDay(i){
  currentDay = i;
  document.querySelectorAll('.day-panel').forEach(function(p,idx){ p.classList.toggle('show', idx===i); });
  document.querySelectorAll('.dtab').forEach(function(t,idx){ t.classList.toggle('active', idx===i); });
}

/* ---- MODAL ---- */
var editingDay=-1, editingStep=-1, isAdding=false;

function openEdit(di,si){
  editingDay=di; editingStep=si; isAdding=false;
  var s=days[di].steps[si];
  document.getElementById('modalTitle').textContent='編輯行程';
  document.getElementById('editType').value=s.type;
  document.getElementById('editTitle').value=s.title;
  document.getElementById('editTime').value=s.time;
  document.getElementById('editNotes').value=s.notes;
  document.getElementById('editLink').value=s.link;
  document.getElementById('editLinkLabel').value=s.linkLabel;
  document.getElementById('modalDeleteBtn').style.display='';
  openModal();
}

function openAddStep(di){
  editingDay=di; editingStep=-1; isAdding=true;
  document.getElementById('modalTitle').textContent='新增行程';
  document.getElementById('editType').value='transport';
  document.getElementById('editTitle').value='';
  document.getElementById('editTime').value='';
  document.getElementById('editNotes').value='';
  document.getElementById('editLink').value='';
  document.getElementById('editLinkLabel').value='';
  document.getElementById('modalDeleteBtn').style.display='none';
  openModal();
}

function openModal(){
  document.getElementById('editModal').classList.add('open');
  document.body.style.overflow='hidden';
  setTimeout(function(){ document.getElementById('editTitle').focus(); },300);
}

function closeModal(){
  document.getElementById('editModal').classList.remove('open');
  document.body.style.overflow='';
}

function timeToMin(t){
  if(!t||!t.trim()) return 9999;
  var parts=t.trim().split(':');
  if(parts.length<2) return 9999;
  var h=parseInt(parts[0])||0, m=parseInt(parts[1])||0;
  // treat times 0-5 as next-day (after midnight)
  if(h<6) h+=24;
  return h*60+m;
}

function sortSteps(di){
  // only sort steps that have a time; no-time steps stay at end in original order
  var withTime=[], noTime=[];
  days[di].steps.forEach(function(s){ (s.time&&s.time.trim()?withTime:noTime).push(s); });
  withTime.sort(function(a,b){ return timeToMin(a.time)-timeToMin(b.time); });
  days[di].steps = withTime.concat(noTime);
}

function saveEdit(){
  var title=document.getElementById('editTitle').value.trim();
  if(!title){ alert('請輸入標題'); return; }
  var step={
    id: isAdding ? nextId++ : days[editingDay].steps[editingStep].id,
    type:document.getElementById('editType').value,
    title:title,
    time:document.getElementById('editTime').value.trim(),
    notes:document.getElementById('editNotes').value.trim(),
    link:document.getElementById('editLink').value.trim(),
    linkLabel:document.getElementById('editLinkLabel').value.trim()||'連結'
  };
  if(isAdding) days[editingDay].steps.push(step);
  else days[editingDay].steps[editingStep]=step;
  sortSteps(editingDay);
  closeModal();
  renderItinerary();
  switchDay(editingDay);
}

function deleteStep(){
  if(!confirm('確定刪除這個行程？')) return;
  days[editingDay].steps.splice(editingStep,1);
  closeModal();
  renderItinerary();
  switchDay(editingDay);
}

/* ============================================================
   EXCHANGE
   ============================================================ */
var currentRate=0.2130, ledger=[];

function fetchRate(){
  document.getElementById('rateTime').textContent='更新中…';
  fetch('https://api.exchangerate-api.com/v4/latest/JPY')
    .then(function(r){return r.json()})
    .then(function(d){
      currentRate=d.rates.TWD;
      document.getElementById('rateNum').textContent=currentRate.toFixed(4);
      var now=new Date();
      document.getElementById('rateTime').textContent=now.getHours()+':'+String(now.getMinutes()).padStart(2,'0')+' 更新';
      calcExchange();
    })
    .catch(function(){ document.getElementById('rateTime').textContent='網路錯誤，使用預設值'; });
}

function calcExchange(){
  var jpy=parseFloat(document.getElementById('jpyInput').value)||0;
  document.getElementById('twdResult').textContent='NT$ '+Math.round(jpy*currentRate).toLocaleString();
  document.getElementById('calcNote').textContent=jpy?'¥'+jpy.toLocaleString()+' × '+currentRate.toFixed(4):'—';
}

function clearExch(){
  document.getElementById('jpyInput').value='';
  document.getElementById('twdResult').textContent='NT$ 0';
  document.getElementById('calcNote').textContent='—';
}

function addLedger(){
  var jpy=parseFloat(document.getElementById('jpyInput').value);
  if(!jpy) return;
  var name=prompt('消費項目名稱？','');
  if(name===null) return;
  ledger.push({name:name||('消費 ¥'+jpy.toLocaleString()),jpy:jpy,twd:Math.round(jpy*currentRate)});
  renderLedger();
}

function renderLedger(){
  document.getElementById('ledgerList').innerHTML=ledger.map(function(item,i){
    return '<div class="ledger-item">'+
      '<div class="li-info"><div class="li-name">'+esc(item.name)+'</div><div class="li-jpy">¥'+item.jpy.toLocaleString()+'</div></div>'+
      '<div class="li-twd">NT$ '+item.twd.toLocaleString()+'</div>'+
      '<button class="li-del" onclick="delLedger('+i+')"><span class="ms">delete</span></button>'+
    '</div>';
  }).join('');
  var tot=document.getElementById('ledgerTotal');
  if(ledger.length){
    tot.style.display='flex';
    document.getElementById('totalJpy').textContent='¥'+ledger.reduce(function(s,x){return s+x.jpy},0).toLocaleString();
    document.getElementById('totalTwd').textContent='NT$ '+ledger.reduce(function(s,x){return s+x.twd},0).toLocaleString();
  } else { tot.style.display='none'; }
}

function delLedger(i){ ledger.splice(i,1); renderLedger(); }

/* ============================================================
   SHOPPING LIST
   ============================================================ */
var shopItems=[];

function addShopItem(){
  var inp=document.getElementById('slInput');
  var name=inp.value.trim();
  if(!name) return;
  shopItems.unshift({id:Date.now(),name:name,checked:false,price:'',price2:'',imgs:[]});
  inp.value='';
  renderShop();
}

function toggleCheck(id){
  var item=shopItems.find(function(x){return x.id===id});
  if(item){item.checked=!item.checked;renderShop();}
}

function delShopItem(id){
  shopItems=shopItems.filter(function(x){return x.id!==id});
  renderShop();
}

function updatePrice(id,val,field){
  var item=shopItems.find(function(x){return x.id===id});
  if(item){item[field]=val;renderShopTWD(id);}
}

function renderShopTWD(id){
  var item=shopItems.find(function(x){return x.id===id});
  if(!item) return;
  var p1=parseFloat(item.price)||0, p2=parseFloat(item.price2)||0;
  var e1=document.getElementById('twd-'+id+'-1'), e2=document.getElementById('twd-'+id+'-2');
  var b1=document.getElementById('badge-'+id+'-1'), b2=document.getElementById('badge-'+id+'-2');
  if(e1) e1.textContent=p1?'NT$'+Math.round(p1*currentRate).toLocaleString():'';
  if(e2) e2.textContent=p2?'NT$'+Math.round(p2*currentRate).toLocaleString():'';
  if(p1&&p2&&b1&&b2){
    if(p1<p2){b1.textContent='較便宜';b1.className='compare-badge compare-better';b2.textContent='較貴';b2.className='compare-badge compare-worse';}
    else if(p2<p1){b2.textContent='較便宜';b2.className='compare-badge compare-better';b1.textContent='較貴';b1.className='compare-badge compare-worse';}
    else{b1.textContent='相同';b1.className='compare-badge';b2.textContent='相同';b2.className='compare-badge';}
    b1.style.display='';b2.style.display='';
  } else {
    if(b1)b1.style.display='none';
    if(b2)b2.style.display='none';
  }
}

function addImg(id){
  var inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';
  inp.onchange=function(){
    var file=inp.files[0];if(!file)return;
    var reader=new FileReader();
    reader.onload=function(e){
      var item=shopItems.find(function(x){return x.id===id});
      if(item){item.imgs.push(e.target.result);renderShop();}
    };
    reader.readAsDataURL(file);
  };
  inp.click();
}

function removeImg(id,idx){
  var item=shopItems.find(function(x){return x.id===id});
  if(item){item.imgs.splice(idx,1);renderShop();}
}

function renderShopItem(item){
  var imgs=item.imgs.map(function(src,i){
    return '<img src="'+src+'" onclick="removeImg('+item.id+','+i+')" title="點擊移除">';
  }).join('');
  return '<div class="sl-item'+(item.checked?' checked':'')+'">'+
    '<div class="sl-top">'+
      '<div class="sl-check'+(item.checked?' on':'')+'" onclick="toggleCheck('+item.id+')">'+(item.checked?'✓':'')+'</div>'+
      '<div class="sl-name">'+esc(item.name)+'</div>'+
      '<button class="sl-del-btn" onclick="delShopItem('+item.id+')"><span class="ms">delete</span></button>'+
    '</div>'+
    '<div class="sl-actions">'+
      '<div class="sl-price-wrap">'+
        '<span class="sl-price-label">¥</span>'+
        '<input class="sl-price-input" value="'+(item.price||'')+'" placeholder="價格1" inputmode="numeric" oninput="updatePrice('+item.id+',this.value,\'price\')">'+
        '<span class="sl-price-twd" id="twd-'+item.id+'-1">'+(item.price?'NT$'+Math.round(parseFloat(item.price)*currentRate).toLocaleString():'')+'</span>'+
        '<span class="compare-badge" id="badge-'+item.id+'-1" style="display:none"></span>'+
      '</div>'+
      '<button class="sl-img-btn" onclick="addImg('+item.id+')"><span class="ms" style="font-size:13px">add_photo_alternate</span>圖</button>'+
    '</div>'+
    '<div class="compare-row">'+
      '<span class="sl-price-label">比價 ¥</span>'+
      '<input class="compare-input" value="'+(item.price2||'')+'" placeholder="價格2" inputmode="numeric" oninput="updatePrice('+item.id+',this.value,\'price2\')">'+
      '<span class="sl-price-twd" id="twd-'+item.id+'-2">'+(item.price2?'NT$'+Math.round(parseFloat(item.price2)*currentRate).toLocaleString():'')+'</span>'+
      '<span class="compare-badge" id="badge-'+item.id+'-2" style="display:none"></span>'+
    '</div>'+
    (imgs?'<div class="sl-img-preview">'+imgs+'</div>':'')+
  '</div>';
}

function renderShop(){
  var unc=shopItems.filter(function(x){return !x.checked});
  var chk=shopItems.filter(function(x){return x.checked});
  document.getElementById('slUnchecked').innerHTML=unc.map(renderShopItem).join('');
  document.getElementById('slChecked').innerHTML=chk.map(renderShopItem).join('');
  document.getElementById('slCheckedWrap').style.display=chk.length?'block':'none';
}

/* ============================================================
   INIT
   ============================================================ */
renderItinerary();
</script>
